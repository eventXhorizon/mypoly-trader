services:
  postgres:
    image: postgres:16-alpine
    container_name: polymarket-terminal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: polymarket_terminal
      POSTGRES_USER: polymarket
      POSTGRES_PASSWORD: polymarket_dev_password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymarket -d polymarket_terminal"]
      interval: 10s
      timeout: 5s
      retries: 5

  multi-watch:
    profiles:
      - simulation
    build:
      context: .
    container_name: polymarket-terminal-multi-watch
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://polymarket:polymarket_dev_password@postgres:5432/polymarket_terminal
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8787
      LIVE_DASHBOARD_URL: ""
      MULTI_WATCH_REQUIRE_DB: "true"
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "multi-watch"]

  live-bot:
    profiles:
      - live
    build:
      context: .
    container_name: polymarket-terminal-live-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8788
      MULTI_WATCH_DASHBOARD_URL: ""
    ports:
      - "8788:8788"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["npm", "run", "bot"]

volumes:
  postgres_data:
