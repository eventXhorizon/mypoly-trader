services:
  postgres:
    image: postgres:16-alpine
    container_name: polymarket-terminal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: polymarket_terminal
      POSTGRES_USER: polymarket
      POSTGRES_PASSWORD: polymarket_dev_password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymarket -d polymarket_terminal"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
